# Publica a pasta site/ no GitHub Pages a cada push na main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  # Os commits feitos pelo robô do teste de bitcoin não disparam "push"; este gatilho publica depois dele.
  workflow_run:
    workflows: ["Bitcoin - teste dos sinais"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
